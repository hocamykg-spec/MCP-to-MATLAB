[project]
name = "mcp-matlab"
version = "1.0.0"
description = "MCP server for MATLAB integration via MATLAB Engine API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "MCP-MATLAB Contributors"}
]
keywords = ["mcp", "matlab", "model-context-protocol", "engine-api", "integration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "numpy>=1.21",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.urls]
Homepage = "https://github.com/your-username/mcp-matlab"
Documentation = "https://github.com/your-username/mcp-matlab#readme"
Repository = "https://github.com/your-username/mcp-matlab"
Issues = "https://github.com/your-username/mcp-matlab/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools]
packages = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]